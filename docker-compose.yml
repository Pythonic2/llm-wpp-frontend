services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://llm-wpp.gestcloud.com.br/api/v1}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - pi_default

networks:
  pi_default:
    external: true
