services:
  frontend:
    image: "ghcr.io/pythonic2/llm-wpp-frontend:${FRONTEND_IMAGE_TAG:?Defina FRONTEND_IMAGE_TAG no Portainer (ex.: sha-abc123...)}"
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - pi_default

networks:
  pi_default:
    external: true
