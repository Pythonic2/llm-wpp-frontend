server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep browser requests on the frontend origin. The backend is published
    # on the Docker host because it may run in a different Portainer endpoint.
    location /api/ {
        proxy_pass http://192.168.0.7:8123;
        proxy_http_version 1.1;
        # Django currently accepts the backend address in ALLOWED_HOSTS, but
        # not the public frontend hostname. Use the origin host for Django's
        # Host validation while preserving the browser host below.
        proxy_set_header Host 192.168.0.7;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # This deployment is accessed over local HTTP on port 8080. Normalize
        # the origin seen by Django and allow its session/CSRF cookies on HTTP.
        proxy_set_header Origin http://192.168.0.7:8080;
        proxy_cookie_flags csrftoken nosecure samesite=lax;
        proxy_cookie_flags sessionid nosecure samesite=lax;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
