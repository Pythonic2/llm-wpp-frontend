server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The backend is reached through the Ubuntu host on the local network.
    # Resolve it at request time so a DNS failure does not stop static pages.
    location /api/ {
        set $backend_host ubuntu.local;
        proxy_pass http://$backend_host:8123;
        proxy_http_version 1.1;
        # Use the backend host accepted by Django while preserving the browser
        # host in X-Forwarded-Host below.
        proxy_set_header Host ubuntu.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cookie_flags csrftoken nosecure samesite=lax;
        proxy_cookie_flags sessionid nosecure samesite=lax;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
